; Supervisor programs for BetterFleets live-data importers.
; Install on the host (not in the container):
;   sudo cp config/supervisor.docker.conf /etc/supervisor/conf.d/betterfleets.conf
;   sudo supervisorctl reread && sudo supervisorctl update
;
; Each program runs inside the django_web container via docker exec,
; so it shares the container's environment and code (/app is a bind
; mount of the checkout). bod_avl is NOT here - it runs as the
; django_bod_avl compose service.
;
; If the web container is down/restarting, docker exec fails and
; supervisord retries (startretries is effectively unlimited).

; listen is disabled: it requires NEW_VEHICLE_WEBHOOK_URL, which is not
; configured in this environment's .env (it asserts and crash-loops).

; [program:listen]
; command=/usr/bin/docker exec -w /app django_web python manage.py listen
; user=noel
; autorestart=true
; startretries=999
; stdout_logfile=/home/noel/betterfleets-logs/listen.log
; stderr_logfile=/home/noel/betterfleets-logs/listen.err

[program:distribute_vehicle_locations]
command=/usr/bin/docker exec -w /app django_web python manage.py distribute_vehicle_locations
user=noel
autorestart=true
