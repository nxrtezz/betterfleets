# Nginx server block for dev.eeveeit.uk
# Add this to your nginx configuration (e.g., /etc/nginx/sites-available/dev.eeveeit.uk)

server {
    listen 80;
    listen [::]:80;
    server_name dev.eeveeit.uk;

    # Redirect HTTP to HTTPS (uncomment after SSL is configured)
    # return 301 https://$server_name$request_uri;

    # Proxy to Django dev server on port 8010
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Serve static files directly (optional, for performance)
    # location /static/ {
    #     alias /path/to/betterfleet/staticfiles_dev/;
    #     expires 30d;
    # }

    # Serve media files directly (optional, for performance)
    # location /media/ {
    #     alias /path/to/betterfleet/media_dev/;
    #     expires 30d;
    }
}

