services:

  web:
    build: .
    entrypoint: sh -c "uv sync --group dev --group test; DEBUG=1 exec ./manage.py runserver 0.0.0.0:8000"
    container_name: django_web
    environment:
      - SECRET_KEY=${SECRET_KEY-}
      - DATABASE_URL=${DATABASE_URL-postgis://postgres:postgres@postgres/postgres}
      - REDIS_URL=${REDIS_URL-redis://redis:6379}
      - NTA_API_KEY
      - NEW_VEHICLE_WEBHOOK_URL=${NEW_VEHICLE_WEBHOOK_URL-}
      - TFL_APP_ID=${TFL_APP_ID-}
      - TFL_APP_KEY=${TFL_APP_KEY-}
      - BODS_API_KEY=${BODS_API_KEY-}
      - BODS_API_AUTH_MODE=${BODS_API_AUTH_MODE-query}
      - BODS_API_USER_AGENT=${BODS_API_USER_AGENT-betterfleet/1.0 (+https://eeveeit.uk)}
      - PYTHONWARNINGS=all
      - STATIC_ROOT=/staticfiles
    volumes:
      - .:/app
      - staticfiles:/staticfiles
    ports:
      - "8000:8000"
      - "35729:35729"
    restart: on-failure

  postgres:
    image: postgis/postgis
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # # sloppy non-durable settings, which allegedly make the tests run faster
    # # not to be used in production!
    # command: --autovacuum=off --fsync=off --synchronous_commit=off --full_page_writes=off --work_mem=12MB --max-connections=10 --max_wal_senders=0
    environment:
      - PGUSER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis

  bod_avl:
    build: .
    entrypoint: sh -c "uv sync --group dev --group test; ./manage.py import_bod_avl --immediate"
    container_name: django_bod_avl
    environment:
      - SECRET_KEY=${SECRET_KEY-}
      - DATABASE_URL=${DATABASE_URL-postgis://postgres:postgres@postgres/postgres}
      - REDIS_URL=${REDIS_URL-redis://redis:6379}
      - BODS_API_KEY=${BODS_API_KEY-}
      - BODS_API_AUTH_MODE=${BODS_API_AUTH_MODE-query}
      - BODS_API_USER_AGENT=${BODS_API_USER_AGENT-betterfleet/1.0 (+https://eeveeit.uk)}
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
    restart: always

  darwin:
    build: .
    entrypoint: sh -c "uv sync --group dev --group test; ./manage.py import_darwin"
    container_name: django_darwin
    environment:
      - SECRET_KEY=${SECRET_KEY-}
      - DATABASE_URL=${DATABASE_URL-postgis://postgres:postgres@postgres/postgres}
      - REDIS_URL=${REDIS_URL-redis://redis:6379}
      - DARWIN_STOMP_HOST=${DARWIN_STOMP_HOST-}
      - DARWIN_STOMP_PORT=${DARWIN_STOMP_PORT-61613}
      - DARWIN_STOMP_USER=${DARWIN_STOMP_USER-}
      - DARWIN_STOMP_PASSWORD=${DARWIN_STOMP_PASSWORD-}
      - DARWIN_STOMP_DESTINATION=${DARWIN_STOMP_DESTINATION-}
      - DARWIN_S3_ACCESS_KEY=${DARWIN_S3_ACCESS_KEY-}
      - DARWIN_S3_SECRET_KEY=${DARWIN_S3_SECRET_KEY-}
      - SIGNALBOX_API_BASE=${SIGNALBOX_API_BASE-}
      - RTT_REFRESH_TOKEN=${RTT_REFRESH_TOKEN-}
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
    restart: always

  signalbox:
    build: .
    entrypoint: sh -c "uv sync --group dev --group test; ./manage.py import_signalbox"
    container_name: django_signalbox
    environment:
      - SECRET_KEY=${SECRET_KEY-}
      - DATABASE_URL=${DATABASE_URL-postgis://postgres:postgres@postgres/postgres}
      - REDIS_URL=${REDIS_URL-redis://redis:6379}
      - SIGNALBOX_API_BASE=${SIGNALBOX_API_BASE-}
      - RTT_REFRESH_TOKEN=${RTT_REFRESH_TOKEN-}
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
    restart: always

volumes:
  postgres_data:
  staticfiles:
