{% extends "admin/change_list.html" %}

{% block object-tools-items %}
    <li>
        <a href="{% url 'admin:vehicles_vehicle_mass_import' %}">Mass import vehicles</a>
    </li>
    {{ block.super }}
{% endblock %}

{% block extrahead %}
    {{ block.super }}
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Collapse all filter sections by default
            const filterTitles = document.querySelectorAll('#changelist-filter h3, #changelist-filter h2');
            filterTitles.forEach(function(title) {
                const content = title.nextElementSibling;
                if (content && content.classList.contains('selected')) {
                    content.classList.remove('selected');
                    title.classList.remove('active');
                }
            });
        });
    </script>
{% endblock %}
