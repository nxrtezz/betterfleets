{% extends "page.html" %}
{% load static %}

{% block title %}BODS Live Tracking Map{% endblock %}

{% block head %}
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="{% static 'vehicles/simple-map/style.css' %}" />
{% endblock head %}

{% block content %}
  <header class="topbar">
    <h1>BODS Live Bus Tracking</h1>
    <div class="status" id="status">Loading vehicles...</div>
    <button id="refreshButton" type="button">Refresh now</button>
  </header>

  <main>
    <div id="map" aria-label="Map of live tracked buses"></div>
  </main>
{% endblock content %}

{% block footer %}
  <script>
    window.SIMPLE_MAP_CONFIG = {
      stadiaApiKey: "{{ stadia_maps_api_key|escapejs }}",
      vehiclesApiUrl: "/vehicles/simple-map-data.json",
    };
  </script>
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="{% static 'vehicles/simple-map/app.js' %}"></script>
{% endblock footer %}
