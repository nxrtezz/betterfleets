name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'BFTApp/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        working-directory: ./BFTApp
        run: npm ci --legacy-peer-deps
      
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      
      - name: Build Android APK
        working-directory: ./BFTApp
        run: eas build --platform android --profile sideload --non-interactive
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: BFTApp/*.apk
          if-no-files-found: error
