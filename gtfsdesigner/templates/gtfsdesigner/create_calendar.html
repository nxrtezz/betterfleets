{% extends 'gtfsdesigner/base.html' %}

{% block title %}Create Calendar - {{ project.name }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto;">
    <h2 style="margin-bottom: 1.5rem;">Create Service Calendar</h2>

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="service_id">Service ID *</label>
            <input type="text" id="service_id" name="service_id" required placeholder="e.g., WEEKDAY">
        </div>

        <div class="form-group">
            <label>Days of Operation</label>
            <div style="display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 0.5rem;">
                <label style="display: flex; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" name="monday" id="monday">
                    Monday
                </label>
                <label style="display: flex; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" name="tuesday" id="tuesday">
                    Tuesday
                </label>
                <label style="display: flex; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" name="wednesday" id="wednesday">
                    Wednesday
                </label>
                <label style="display: flex; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" name="thursday" id="thursday">
                    Thursday
                </label>
                <label style="display: flex; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" name="friday" id="friday">
                    Friday
                </label>
                <label style="display: flex; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" name="saturday" id="saturday">
                    Saturday
                </label>
                <label style="display: flex; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" name="sunday" id="sunday">
                    Sunday
                </label>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="start_date">Start Date *</label>
                <input type="date" id="start_date" name="start_date" required>
            </div>
            <div class="form-group">
                <label for="end_date">End Date (optional)</label>
                <input type="date" id="end_date" name="end_date">
            </div>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
            <button type="submit" class="btn btn-primary">Create Calendar</button>
            <a href="{% url 'gtfsdesigner:project_detail' project.id %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
