{% extends "admin/base_site.html" %}

{% block content %}
<h1>Assign selected services to an operator</h1>

<p>The following services will be assigned to the selected operator:</p>

<ul>
    {% for obj in queryset %}
        <li>{{ obj }}</li>
    {% endfor %}
</ul>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" name="apply" value="Assign" class="default">
    <a href="{% url 'admin:busstops_service_changelist' %}" class="button">Cancel</a>
</form>
{% endblock %}
