{% extends 'map.html' %}

{% block title %}Bus tracker map - {{ object }} - bustimes.org{% endblock %}

{% block canonical %}
    <link rel="canonical" href="https://bustimes.org{{ map_url }}">
{% endblock canonical %}

{% load static %}

{% block head %}
    <meta property="og:title" content="Map - {{ object }}">
    <link rel="stylesheet" href="{% static 'dist/js/app.css' %}">
    <link rel="stylesheet" media="print" href="/liveries.{{ liveries_css_version }}.css" onload="this.onload=null;this.removeAttribute('media')">
{% endblock head %}

{% block footer %}
    <script>OPERATOR_ID="{{ operator_ids }}";</script>
    <script src="{% static 'dist/js/app.js' %}"></script>
{% endblock footer %}
