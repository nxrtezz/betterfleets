services:
  rf:
    image: ghcr.io/bustimes/bustimes.org/bustimes-base:3.14
    container_name: RF
    working_dir: /app
    volumes:
      - ../../:/app:cached
    network_mode: host
    command: ["python", "manage.py", "import_redfunnel"]
    environment:
      - DATABASE_URL=${DATABASE_URL-postgis://postgres:postgres:localhost:5432/postgres}
      - REDIS_URL=${REDIS_URL-redis://localhost:6379}
      - SECRET_KEY=${SECRET_KEY-dev}
      - DJANGO_SETTINGS_MODULE=buses.settings
    restart: on-failure
